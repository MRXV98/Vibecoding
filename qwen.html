<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PythonCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-2: #1b1b32;
    --bg-3: #2a2a40;
    --text: #dfdfe2;
    --text-dim: #a5a5b5;
    --accent: #f1be32;
    --accent-2: #99c9ff;
    --success: #3bd16f;
    --error: #ff6b6b;
    --border: #3b3b4f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--bg-2);
    padding: 12px 24px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo::before { content: "🐍"; font-size: 26px; }
  .header-stats { display: flex; gap: 20px; align-items: center; font-size: 14px; }
  .progress-bar {
    width: 200px;
    height: 8px;
    background: var(--bg-3);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.3s;
  }
  .main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    width: 300px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .section-title {
    padding: 14px 18px;
    background: var(--bg-3);
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .lesson-item {
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
  }
  .lesson-item:hover { background: var(--bg-3); }
  .lesson-item.active {
    background: var(--bg-3);
    border-left: 3px solid var(--accent);
    padding-left: 15px;
  }
  .lesson-item.completed .check { color: var(--success); }
  .check {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
  }
  .lesson-item.completed .check {
    background: var(--success);
    border-color: var(--success);
    color: #000;
  }
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lesson-header {
    padding: 16px 24px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .lesson-header h1 {
    font-size: 22px;
    color: var(--accent-2);
    margin-bottom: 4px;
  }
  .lesson-header .breadcrumb {
    font-size: 12px;
    color: var(--text-dim);
  }
  .lesson-body {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .theory-panel {
    flex: 1;
    padding: 24px 32px;
    overflow-y: auto;
    line-height: 1.7;
    font-size: 15px;
  }
  .theory-panel h2 {
    color: var(--accent);
    margin: 20px 0 12px;
    font-size: 18px;
  }
  .theory-panel h2:first-child { margin-top: 0; }
  .theory-panel p { margin-bottom: 12px; }
  .theory-panel code {
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 3px;
    color: var(--accent-2);
    font-family: "Consolas", "Monaco", monospace;
    font-size: 13px;
  }
  .theory-panel pre {
    background: var(--bg-3);
    padding: 14px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 12px 0;
    border-left: 3px solid var(--accent);
  }
  .theory-panel pre code {
    background: none;
    padding: 0;
    color: var(--text);
    display: block;
    line-height: 1.5;
  }
  .theory-panel ul, .theory-panel ol {
    margin: 10px 0 10px 24px;
  }
  .theory-panel li { margin-bottom: 6px; }
  .editor-panel {
    width: 50%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--bg-2);
  }
  .editor-toolbar {
    padding: 8px 12px;
    background: var(--bg-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .editor-toolbar .label {
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .editor-toolbar button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    margin-left: 6px;
    transition: opacity 0.2s;
  }
  .editor-toolbar button:hover { opacity: 0.85; }
  .editor-toolbar button.secondary {
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .editor-toolbar button:disabled { opacity: 0.5; cursor: wait; }
  #codeEditor {
    flex: 1;
    background: #0d0d1f;
    color: #e0e0ff;
    border: none;
    padding: 16px;
    font-family: "Consolas", "Monaco", "Courier New", monospace;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    tab-size: 4;
  }
  .console {
    height: 180px;
    background: #000;
    border-top: 2px solid var(--border);
    padding: 12px;
    overflow-y: auto;
    font-family: "Consolas", monospace;
    font-size: 13px;
  }
  .console-header {
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .console-line { margin-bottom: 4px; white-space: pre-wrap; word-break: break-word; }
  .console-line.error { color: var(--error); }
  .console-line.success { color: var(--success); }
  .console-line.info { color: var(--accent-2); }
  .tests-panel {
    padding: 12px;
    background: var(--bg-3);
    border-top: 1px solid var(--border);
    max-height: 200px;
    overflow-y: auto;
  }
  .tests-panel h3 {
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .test-item {
    padding: 6px 10px;
    margin-bottom: 4px;
    border-radius: 3px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-2);
  }
  .test-item.pass { border-left: 3px solid var(--success); }
  .test-item.fail { border-left: 3px solid var(--error); }
  .test-icon { font-weight: bold; }
  .test-item.pass .test-icon { color: var(--success); }
  .test-item.fail .test-icon { color: var(--error); }
  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 35, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid var(--bg-3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 20px; color: var(--accent); font-size: 16px; }
  .loading-sub { margin-top: 8px; color: var(--text-dim); font-size: 13px; }
  .certificate {
    text-align: center;
    padding: 40px;
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
    border: 2px solid var(--accent);
    border-radius: 10px;
    margin: 20px;
  }
  .certificate h1 { color: var(--accent); font-size: 32px; margin-bottom: 16px; }
  .certificate .trophy { font-size: 80px; margin-bottom: 20px; }
  .sidebar::-webkit-scrollbar, .theory-panel::-webkit-scrollbar, .console::-webkit-scrollbar, .tests-panel::-webkit-scrollbar {
    width: 8px;
  }
  .sidebar::-webkit-scrollbar-track, .theory-panel::-webkit-scrollbar-track, .console::-webkit-scrollbar-track, .tests-panel::-webkit-scrollbar-track {
    background: var(--bg);
  }
  .sidebar::-webkit-scrollbar-thumb, .theory-panel::-webkit-scrollbar-thumb, .console::-webkit-scrollbar-thumb, .tests-panel::-webkit-scrollbar-thumb {
    background: var(--bg-3);
    border-radius: 4px;
  }
  @media (max-width: 900px) {
    .sidebar { width: 220px; }
    .editor-panel { width: 55%; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем Python...</div>
  <div class="loading-sub">Первый запуск может занять 10-20 секунд</div>
</div>

<header>
  <div class="logo">PythonCamp</div>
  <div class="header-stats">
    <span id="progressText">0 / 0 уроков</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <button onclick="resetProgress()" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;">Сброс</button>
  </div>
</header>

<div class="main-container">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content-area">
    <div class="lesson-header">
      <div class="breadcrumb" id="breadcrumb"></div>
      <h1 id="lessonTitle"></h1>
    </div>
    <div class="lesson-body">
      <div class="theory-panel" id="theoryPanel"></div>
      <div class="editor-panel">
        <div class="editor-toolbar">
          <span class="label">script.py</span>
          <div>
            <button class="secondary" onclick="resetCode()">↺ Сброс</button>
            <button class="secondary" onclick="showSolution()">💡 Решение</button>
            <button onclick="runCode()">▶ Запустить</button>
            <button onclick="checkSolution()" id="checkBtn">✓ Проверить</button>
          </div>
        </div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
        <div class="tests-panel" id="testsPanel"></div>
        <div class="console">
          <div class="console-header">Консоль</div>
          <div id="consoleOutput"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   ПРОГРАММА КУРСА ПО PYTHON
   ============================================================ */
const curriculum = [
  {
    section: "Основы Python",
    lessons: [
      {
        id: "intro",
        title: "1. Привет, Python!",
        theory: `
          <h2>Добро пожаловать в Python!</h2>
          <p>Python — один из самых популярных языков программирования. Он известен своим простым и читаемым синтаксисом.</p>
          <p>Первая программа на любом языке — это <code>Hello, World!</code>. В Python это делается одной строкой:</p>
          <pre><code>print("Hello, World!")</code></pre>
          <p>Функция <code>print()</code> выводит текст на экран. Текст (строка) заключается в кавычки — двойные <code>"..."</code> или одинарные <code>'...'</code>.</p>
          <h2>Задание</h2>
          <p>Выведите на экран фразу <b>Hello, World!</b> (именно так, с большой H и W).</p>
        `,
        starter: `# Напишите ваш первый код здесь\n`,
        solution: `print("Hello, World!")`,
        tests: [
          { desc: 'Программа должна вывести: Hello, World!', check: 'output.strip() == "Hello, World!"' }
        ]
      },
      {
        id: "comments",
        title: "2. Комментарии",
        theory: `
          <h2>Комментарии в Python</h2>
          <p>Комментарии — это пояснения в коде, которые игнорируются интерпретатором. Они помогают понять логику программы.</p>
          <p>Однострочный комментарий начинается с символа <code>#</code>:</p>
          <pre><code># Это комментарий
print("Привет")  # Это тоже комментарий</code></pre>
          <p>Многострочный комментарий заключается в тройные кавычки:</p>
          <pre><code>"""
Это
многострочный
комментарий
"""</code></pre>
          <h2>Задание</h2>
          <p>Добавьте комментарий <code># Мой первый комментарий</code> и выведите слово <b>Python</b>.</p>
        `,
        starter: `# Напишите комментарий и выведите Python\n`,
        solution: `# Мой первый комментарий\nprint("Python")`,
        tests: [
          { desc: 'Вывод должен быть: Python', check: 'output.strip() == "Python"' },
          { desc: 'В коде должен быть комментарий', check: '"#" in code' }
        ]
      },
      {
        id: "variables",
        title: "3. Переменные",
        theory: `
          <h2>Переменные</h2>
          <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
          <pre><code>name = "Анна"
age = 25
print(name)
print(age)</code></pre>
          <p>Правила именования переменных:</p>
          <ul>
            <li>Могут содержать буквы, цифры и символ <code>_</code></li>
            <li>Не могут начинаться с цифры</li>
            <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
          </ul>
          <h2>Задание</h2>
          <p>Создайте переменную <code>language</code> со значением <code>"Python"</code> и выведите её.</p>
        `,
        starter: `# Создайте переменную language и выведите её\n`,
        solution: `language = "Python"\nprint(language)`,
        tests: [
          { desc: 'Вывод должен быть: Python', check: 'output.strip() == "Python"' },
          { desc: 'Должна быть переменная language', check: '"language" in code' }
        ]
      },
      {
        id: "data-types",
        title: "4. Типы данных",
        theory: `
          <h2>Основные типы данных</h2>
          <p>В Python есть несколько базовых типов:</p>
          <ul>
            <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
            <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
            <li><code>str</code> — строки: <code>"привет"</code></li>
            <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
          </ul>
          <p>Функция <code>type()</code> возвращает тип значения:</p>
          <pre><code>print(type(42))        # &lt;class 'int'&gt;
print(type(3.14))      # &lt;class 'float'&gt;
print(type("hello"))   # &lt;class 'str'&gt;
print(type(True))      # &lt;class 'bool'&gt;</code></pre>
          <h2>Задание</h2>
          <p>Выведите тип числа <code>3.14</code> с помощью функции <code>type()</code>.</p>
        `,
        starter: `# Выведите тип числа 3.14\n`,
        solution: `print(type(3.14))`,
        tests: [
          { desc: 'Вывод должен содержать float', check: '"float" in output' }
        ]
      },
      {
        id: "numbers",
        title: "5. Числа и арифметика",
        theory: `
          <h2>Арифметические операции</h2>
          <pre><code>a = 10
b = 3

print(a + b)   # Сложение: 13
print(a - b)   # Вычитание: 7
print(a * b)   # Умножение: 30
print(a / b)   # Деление: 3.333...
print(a // b)  # Целочисленное деление: 3
print(a % b)   # Остаток от деления: 1
print(a ** b)  # Возведение в степень: 1000</code></pre>
          <h2>Задание</h2>
          <p>Вычислите и выведите результат: <code>17</code> в степени <code>2</code>.</p>
        `,
        starter: `# Выведите 17 в степени 2\n`,
        solution: `print(17 ** 2)`,
        tests: [
          { desc: 'Вывод должен быть: 289', check: 'output.strip() == "289"' }
        ]
      },
      {
        id: "strings",
        title: "6. Строки",
        theory: `
          <h2>Работа со строками</h2>
          <p>Строки можно объединять (конкатенация) с помощью <code>+</code>:</p>
          <pre><code>first = "Hello"
second = "World"
print(first + " " + second)  # Hello World</code></pre>
          <p>Строку можно повторить:</p>
          <pre><code>print("Ha" * 3)  # HaHaHa</code></pre>
          <p>Длина строки — функция <code>len()</code>:</p>
          <pre><code>print(len("Python"))  # 6</code></pre>
          <h2>Задание</h2>
          <p>Создайте переменные <code>first = "Python"</code> и <code>second = "Camp"</code>. Выведите их объединение через пробел: <code>Python Camp</code>.</p>
        `,
        starter: `# Создайте переменные и объедините их\n`,
        solution: `first = "Python"\nsecond = "Camp"\nprint(first + " " + second)`,
        tests: [
          { desc: 'Вывод: Python Camp', check: 'output.strip() == "Python Camp"' }
        ]
      },
      {
        id: "f-strings",
        title: "7. Форматирование строк",
        theory: `
          <h2>f-строки</h2>
          <p>Самый удобный способ вставки переменных в строку — f-строки (Python 3.6+):</p>
          <pre><code>name = "Анна"
age = 25
print(f"Меня зовут {name}, мне {age} лет")</code></pre>
          <p>Внутри фигурных скобок <code>{}</code> можно писать любые выражения:</p>
          <pre><code>x = 5
print(f"Квадрат {x} равен {x**2}")</code></pre>
          <h2>Задание</h2>
          <p>Создайте переменные <code>lang = "Python"</code> и <code>year = 1991</code>. Выведите: <code>Python был создан в 1991 году</code>, используя f-строку.</p>
        `,
        starter: `# Используйте f-строку\n`,
        solution: `lang = "Python"\nyear = 1991\nprint(f"{lang} был создан в {year} году")`,
        tests: [
          { desc: 'Вывод: Python был создан в 1991 году', check: 'output.strip() == "Python был создан в 1991 году"' },
          { desc: 'Использована f-строка', check: 'code.includes("f\\"") || code.includes("f\\'")' }
        ]
      },
      {
        id: "input",
        title: "8. Ввод данных",
        theory: `
          <h2>Функция input()</h2>
          <p><code>input()</code> считывает строку, введённую пользователем:</p>
          <pre><code>name = input("Введите имя: ")
print(f"Привет, {name}!")</code></pre>
          <p><b>Важно:</b> <code>input()</code> всегда возвращает строку. Чтобы получить число, используйте <code>int()</code> или <code>float()</code>:</p>
          <pre><code>age = int(input("Возраст: "))
print(f"Через год вам будет {age + 1}")</code></pre>
          <h2>Задание</h2>
          <p>В нашей среде ввод имитируется. Напишите программу, которая считывает <code>input()</code> и выводит <code>Привет, [введённое]!</code>.</p>
          <p><i>Тест использует ввод "Мир"</i></p>
        `,
        starter: `# Считайте ввод и поприветствуйте\n`,
        solution: `name = input()\nprint(f"Привет, {name}!")`,
        tests: [
          { desc: 'При вводе "Мир" вывод: Привет, Мир!', check: 'output.strip() == "Привет, Мир!"', input: "Мир" }
        ]
      }
    ]
  },
  {
    section: "Управляющие конструкции",
    lessons: [
      {
        id: "if-else",
        title: "9. Условные операторы",
        theory: `
          <h2>if / elif / else</h2>
          <p>Условные операторы позволяют выполнять код в зависимости от условия:</p>
          <pre><code>age = 18

if age >= 18:
    print("Совершеннолетний")
elif age >= 14:
    print("Подросток")
else:
    print("Ребёнок")</code></pre>
          <p><b>Важно:</b> в Python отступы (обычно 4 пробела) определяют блоки кода!</p>

          <ul>

/* ============================================================
   СОСТОЯНИЕ ПРИЛОЖЕНИЯ
   ============================================================ */
let pyodide = null;
let currentSection = 0;
let currentLesson = 0;
let completed = JSON.parse(localStorage.getItem('pythoncamp_completed') || '{}');

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ PYODIDE
   ============================================================ */
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loadingOverlay').style.display = 'none';
    renderSidebar();
    loadLesson(0, 0);
    updateProgress();
  } catch (e) {
    document.querySelector('.loading-text').textContent = 'Ошибка загрузки Python';
    document.querySelector('.loading-sub').textContent = e.message;
  }
}

/* ============================================================
   ОТРИСОВКА БОКОВОЙ ПАНЕЛИ
   ============================================================ */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  curriculum.forEach((section, si) => {
    html += `<div class="section-title">${section.section}</div>`;
    section.lessons.forEach((lesson, li) => {
      const isCompleted = completed[lesson.id];
      const isActive = si === currentSection && li === currentLesson;
      html += `
        <div class="lesson-item ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}"
             onclick="loadLesson(${si}, ${li})">
          <div class="check">${isCompleted ? '✓' : ''}</div>
          <div>${lesson.title}</div>
        </div>
      `;
    });
  });
  sidebar.innerHTML = html;
}

/* ============================================================
   ЗАГРУЗКА УРОКА
   ============================================================ */
function loadLesson(si, li) {
  currentSection = si;
  currentLesson = li;
  const lesson = curriculum[si].lessons[li];
  
  document.getElementById('breadcrumb').textContent = `${curriculum[si].section} / Урок ${li + 1}`;
  document.getElementById('lessonTitle').textContent = lesson.title;
  document.getElementById('theoryPanel').innerHTML = lesson.theory;
  
  const savedCode = localStorage.getItem(`code_${lesson.id}`);
  document.getElementById('codeEditor').value = savedCode || lesson.starter;
  
  renderTests([]);
  clearConsole();
  renderSidebar();
  
  // Навигация стрелками
  window.scrollTo(0, 0);
  document.getElementById('theoryPanel').scrollTop = 0;
}

/* ============================================================
   РЕНДЕР ТЕСТОВ
   ============================================================ */
function renderTests(results) {
  const panel = document.getElementById('testsPanel');
  const lesson = curriculum[currentSection].lessons[currentLesson];
  
  let html = '<h3>Требования к заданию</h3>';
  lesson.tests.forEach((test, i) => {
    const result = results[i];
    let cls = '';
    let icon = '○';
    if (result !== undefined) {
      cls = result ? 'pass' : 'fail';
      icon = result ? '✓' : '✗';
    }
    html += `<div class="test-item ${cls}"><span class="test-icon">${icon}</span><span>${test.desc}</span></div>`;
  });
  panel.innerHTML = html;
}

/* ============================================================
   КОНСОЛЬ
   ============================================================ */
function clearConsole() {
  document.getElementById('consoleOutput').innerHTML = '';
}

function logToConsole(text, type = '') {
  const output = document.getElementById('consoleOutput');
  const line = document.createElement('div');
  line.className = 'console-line ' + type;
  line.textContent = text;
  output.appendChild(line);
  output.parentElement.scrollTop = output.parentElement.scrollHeight;
}

/* ============================================================
   ВЫПОЛНЕНИЕ КОДА
   ============================================================ */
async function runCode() {
  const code = document.getElementById('codeEditor').value;
  const lesson = curriculum[currentSection].lessons[currentLesson];
  
  clearConsole();
  logToConsole('>>> Выполнение...', 'info');
  
  try {
    // Перехватываем stdout
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stdin = StringIO(${JSON.stringify(lesson.tests[0]?.input || '')})
    `);
    
    await pyodide.runPythonAsync(code);
    
    const output = pyodide.runPython('sys.stdout.getvalue()');
    // Восстанавливаем stdout
    pyodide.runPython('sys.stdout = sys.__stdout__');
    
    if (output) {
      logToConsole(output);
    } else {
      logToConsole('(нет вывода)', 'info');
    }
    logToConsole('>>> Выполнено успешно', 'success');
    return { output, success: true };
  } catch (e) {
    pyodide.runPython('sys.stdout = sys.__stdout__');
    logToConsole('Ошибка: ' + e.message, 'error');
    return { output: '', success: false, error: e.message };
  }
}

/* ============================================================
   ПРОВЕРКА РЕШЕНИЯ
   ============================================================ */
async function checkSolution() {
  const code = document.getElementById('codeEditor').value;
  const lesson = curriculum[currentSection].lessons[currentLesson];
  const btn = document.getElementById('checkBtn');
  
  btn.disabled = true;
  btn.textContent = '⏳ Проверка...';
  clearConsole();
  
  const results = [];
  let allPassed = true;
  
  for (const test of lesson.tests) {
    try {
      // Подготовка окружения
      pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stdin = StringIO(${JSON.stringify(test.input || '')})
      `);
      
      await pyodide.runPythonAsync(code);
      
      const output = pyodide.runPython('sys.stdout.getvalue()');
      pyodide.runPython('sys.stdout = sys.__stdout__');
      
      // Проверка условия
      const checkResult = pyodide.runPython(`
code = ${JSON.stringify(code)}
output = ${JSON.stringify(output)}
(${test.check})
      `);
      
      results.push(checkResult);
      if (!checkResult) allPassed = false;
    } catch (e) {
      pyodide.runPython('sys.stdout = sys.__stdout__');
      results.push(false);
      allPassed = false;
      logToConsole('Ошибка: ' + e.message, 'error');
    }
  }
  
  renderTests(results);
  
  if (allPassed) {
    logToConsole('✓ Все тесты пройдены! Урок завершён.', 'success');
    completed[lesson.id] = true;
    localStorage.setItem('pythoncamp_completed', JSON.stringify(completed));
    localStorage.setItem(`code_${lesson.id}`, code);
    updateProgress();
    renderSidebar();
    
    // Автопереход к следующему уроку через 2 секунды
    setTimeout(() => {
      const nextLesson = getNextLesson();
      if (nextLesson) {
        if (confirm('Отличный результат! Перейти к следующему уроку?')) {
          loadLesson(nextLesson.si, nextLesson.li);
        }
      } else {
        showCertificate();
      }
    }, 1500);
  } else {
    logToConsole('✗ Некоторые тесты не пройдены. Попробуйте ещё раз.', 'error');
  }
  
  btn.disabled = false;
  btn.textContent = '✓ Проверить';
}

function getNextLesson() {
  let si = currentSection, li = currentLesson + 1;
  if (li >= curriculum[si].lessons.length) {
    si++;
    li = 0;
  }
  if (si >= curriculum.length) return null;
  return { si, li };
}

/* ============================================================
   ДОПОЛНИТЕЛЬНЫЕ ДЕЙСТВИЯ
   ============================================================ */
function resetCode() {
  const lesson = curriculum[currentSection].lessons[currentLesson];
  document.getElementById('codeEditor').value = lesson.starter;
  clearConsole();
}

function showSolution() {
  if (confirm('Показать решение? Это может помешать вам научиться.')) {
    const lesson = curriculum[currentSection].lessons[currentLesson];
    document.getElementById('codeEditor').value = lesson.solution;
  }
}

function updateProgress() {
  const total = curriculum.reduce((sum, s) => sum + s.lessons.length, 0);
  const done = Object.keys(completed).length;
  document.getElementById('progressText').textContent = `${done} / ${total} уроков`;
  document.getElementById('progressFill').style.width = `${(done / total) * 100}%`;
}

function resetProgress() {
  if (confirm('Сбросить весь прогресс?')) {
    completed = {};
    localStorage.removeItem('pythoncamp_completed');
    curriculum.forEach(s => s.lessons.forEach(l => {
      localStorage.removeItem(`code_${l.id}`);
    }));
    updateProgress();
    renderSidebar();
    loadLesson(0, 0);
  }
}

      <p style="margin-top:30px;color:var(--accent);font-size:20px;">Сертификат PythonCamp</p>
      <p style="color:var(--text-dim);margin-top:10px;">Выдан: ${new Date().toLocaleDateString('ru-RU')}</p>
    </div>
  `;
}

/* ============================================================
   ОБРАБОТКА TAB В РЕДАКТОРЕ
   ============================================================ */
document.getElementById('codeEditor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 4;
  }
  // Ctrl+Enter — запустить
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
  // Ctrl+Shift+Enter — проверить
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Enter') {
    e.preventDefault();
    checkSolution();
  }
});

// Автосохранение кода
document.getElementById('codeEditor').addEventListener('input', function() {
  const lesson = curriculum[currentSection].lessons[currentLesson];
  localStorage.setItem(`code_${lesson.id}`, this.value);
});

// Запуск
initPyodide();
</script>
