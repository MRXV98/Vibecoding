
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibecoding — навигация</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main { width: 100%; max-width: 560px; }

  header { margin-bottom: 28px; }
  h1 { font-size: 28px; font-weight: 700; }
  h1 span { color: #58a6ff; }
  .sub { color: #8b949e; margin-top: 6px; font-size: 14px; }

  nav { display: grid; gap: 12px; }

  a.card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    color: #e6edf3;
    text-decoration: none;
    transition: border-color .15s, background .15s, transform .15s;
  }
  a.card:hover,
  a.card:focus-visible {
    border-color: #58a6ff;
    background: #1c2129;
    transform: translateX(4px);
    outline: none;
  }

  .icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
  }
  .icon.giga { background: rgba(255, 90, 90, .15);  color: #ff7b72; }
  .icon.qwen { background: rgba(88, 166, 255, .15); color: #58a6ff; }

  .texts { display: flex; flex-direction: column; gap: 2px; }
  .title { font-size: 16px; font-weight: 600; }
  .file  { font-size: 12px; color: #8b949e; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  .arrow { margin-left: auto; color: #8b949e; font-size: 18px; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: #8b949e;
  }
  footer a { color: #58a6ff; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Vibecoding <span>/ навигация</span></h1>
    <p class="sub">Выберите страницу, чтобы открыть её:</p>
  </header>

  <nav>
    <a class="card" href="gigachat.html">
      <div class="icon giga">G</div>
      <div class="texts">
        <span class="title">GigaChat</span>
        <span class="file">gigachat.html</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="card" href="qwen%20agent%20mode.html">
      <div class="icon qwen">Q</div>
      <div class="texts">
        <span class="title">Qwen — Agent Mode</span>
        <span class="file">qwen agent mode.html</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="card" href="qwen%20web%20mode.html">
      <div class="icon qwen">Q</div>
      <div class="texts">
        <span class="title">Qwen — Web Mode</span>
        <span class="file">qwen web mode.html</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="card" href="qwen.html">
      <div class="icon qwen">Q</div>
      <div class="texts">
        <span class="title">Qwen</span>
        <span class="file">qwen.html</span>
      </div>
      <span class="arrow">&rarr;</span>
    </a>
  </nav>

  <footer>
    Репозиторий: <a href="https://github.com/MRXV98/Vibecoding" target="_blank" rel="noopener">MRXV98/Vibecoding</a>
  </footer>
</main>
</body>
</html>
