
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — бесплатная интерактивная программа по Python</title>
<meta name="description" content="PyCamp — бесплатный аналог freeCodeCamp: интерактивный курс Python прямо в браузере. 5 сертификаций, 37 шагов, реальный интерпретатор CPython (Pyodide), автотесты и сертификаты.">
<style>
:root{
  --bg:#0a0e1a; --bg2:#111729; --panel:#151c30; --panel2:#1b2338; --border:#252d45;
  --text:#e6e9f2; --muted:#98a2bf; --accent:#3b82f6; --accent2:#22d3ee;
  --green:#22c55e; --red:#f0526a; --yellow:#f0b429; --purple:#a78bfa;
  --code-bg:#0d1220; --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:10px; --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
[data-theme="light"]{
  --bg:#f2f4f9; --bg2:#e8ecf5; --panel:#ffffff; --panel2:#f4f6fb; --border:#d7deec;
  --text:#131a2b; --muted:#5b6683; --accent:#1d4ed8; --accent2:#0891b2;
  --code-bg:#fbfcff; --shadow:0 8px 24px rgba(20,30,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3a4566}

/* ---------- HEADER ---------- */
header.topbar{
  height:58px; display:flex; align-items:center; gap:16px; padding:0 16px;
  background:var(--bg2); border-bottom:1px solid var(--border); position:relative; z-index:40;
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.3px;cursor:pointer;user-select:none}
.logo .mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,#f0b429,#22c55e 55%,#22d3ee);color:#08111f;font-weight:900;font-size:17px;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;
}
.logo small{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.topnav{display:flex;gap:4px;margin-left:8px}
.topnav button{
  background:none;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;
}
.topnav button:hover{color:var(--text);background:var(--panel)}
.topnav button.active{color:var(--text);background:var(--panel);border-color:var(--border)}
.spacer{flex:1}
.hdr-right{display:flex;align-items:center;gap:10px}
.progress-pill{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);
  padding:5px 10px;border-radius:999px;font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap
}
.progress-pill .bar{width:70px;height:6px;border-radius:4px;background:var(--border);overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--green));width:0}
.icon-btn{
  width:36px;height:36px;display:grid;place-items:center;border-radius:9px;background:var(--panel);
  border:1px solid var(--border);cursor:pointer;font-size:16px;line-height:1
}
.icon-btn:hover{background:var(--panel2)}
.btn{
  background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;
  transition:filter .15s, transform .05s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--panel2)}
.btn.green{background:var(--green);color:#04140a}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%;padding:12px}

/* ---------- SHELL ---------- */
.shell{display:flex;height:calc(100vh - 58px);overflow:hidden}
aside.sidebar{
  width:308px;min-width:308px;background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 12px 60px
}
.side-head{padding:4px 8px 12px}
.side-head h2{margin:0 0 4px;font-size:15px;letter-spacing:.02em}
.side-head p{margin:0;color:var(--muted);font-size:12.5px}
.big-progress{margin:10px 0 4px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:11px 12px}
.big-progress .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:7px}
.big-progress .row b{color:var(--text)}
.big-progress .track{height:8px;border-radius:6px;background:var(--border);overflow:hidden}
.big-progress .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--green));transition:width .4s}
.track-block{margin-top:14px}
.track-title{
  display:flex;align-items:center;gap:8px;padding:8px;font-weight:800;font-size:13px;cursor:pointer;border-radius:8px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);user-select:none
}
.track-title:hover{background:var(--panel);color:var(--text)}
.track-title .cnt{margin-left:auto;font-size:11px;background:var(--panel);border:1px solid var(--border);padding:1px 7px;border-radius:999px;font-weight:700}
.track-title .caret{transition:transform .2s;font-size:10px}
.track-block.collapsed .caret{transform:rotate(-90deg)}
.track-block.collapsed .lesson-list{display:none}
.lesson-list{list-style:none;margin:2px 0 0;padding:0}
.lesson-item{display:flex;align-items:center;gap:9px}
.lesson-item .ln{width:22px;text-align:center;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;flex:0 0 22px}
.lesson-item a{
  flex:1;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--text);
  font-size:13.5px;cursor:pointer;border:1px solid transparent
}
.lesson-item a:hover{background:var(--panel);text-decoration:none}
.lesson-item a.current{background:var(--panel2);border-color:var(--border);font-weight:600}
.lesson-item .st{width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:10px;color:transparent}
.lesson-item .st.done{background:var(--green);border-color:var(--green);color:#04140a;font-weight:900}
.lesson-item .st.draft{border-color:var(--yellow)}
.lesson-item .st.cur{border-color:var(--accent)}
.cert-line{
  margin:10px 8px 0;padding:9px 11px;border:1px dashed var(--border);border-radius:var(--radius);
  font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;background:var(--panel)
}
.cert-line.ready{border-style:solid;border-color:var(--green);color:var(--text);cursor:pointer}
.cert-line.ready:hover{background:var(--panel2)}

/* ---------- VIEWS ---------- */
main#main{flex:1;overflow:hidden;display:flex;min-width:0}
.view{display:none;flex:1;min-width:0}
.view.active{display:flex}
.view.page{display:none;overflow-y:auto;padding:28px 32px 80px}
.view.page.active{display:block}
.page-inner{max-width:980px;margin:0 auto}
.page h1{font-size:30px;margin:0 0 6px;letter-spacing:-.5px}
.page h2{font-size:21px;margin:32px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.page h3{font-size:16px;margin:20px 0 6px}
.page .lead{color:var(--muted);font-size:16px;margin:0 0 22px}
.hero{
  background:radial-gradient(1200px 400px at 10% -20%,rgba(59,130,246,.35),transparent),
             radial-gradient(900px 380px at 90% 0%,rgba(34,211,238,.22),transparent),var(--panel);
  border:1px solid var(--border);border-radius:16px;padding:30px;margin-bottom:26px;box-shadow:var(--shadow)
}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 10px}
.hero p{color:var(--muted);font-size:16.5px;max-width:760px;margin:0 0 18px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.badge{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);font-weight:600}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cert-card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;
  transition:transform .12s, border-color .12s
}
.cert-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.cert-card .ic{font-size:24px}
.cert-card h3{margin:0;font-size:17px}
.cert-card p{margin:0;color:var(--muted);font-size:13.5px;flex:1}
.cert-card .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:600}
.cert-card .track{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
.cert-card .track i{display:block;height:100%;background:var(--green);width:0}
table.ref{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:13.5px}
table.ref th,table.ref td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
table.ref th{background:var(--panel2);font-weight:700}
table.ref td code,table.ref th code{white-space:nowrap}
code{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:.9em}
pre.snip{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
.callout{border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;padding:12px 14px;margin:14px 0;color:var(--muted);font-size:14px}
.callout.warn{border-color:var(--yellow)}
.kbd{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.two-col{grid-template-columns:1fr}}

/* ---------- LESSON WORKSPACE ---------- */
.workspace{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(400px,1.25fr) minmax(300px,.95fr);flex:1;min-width:0;overflow:hidden}
.pane{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.pane + .pane{border-left:1px solid var(--border)}
.pane-head{
  display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--border);
  font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);flex:0 0 auto
}
.pane-head .spacer{flex:1}
.pane-body{flex:1;overflow-y:auto;min-height:0}
#lesson-body{padding:20px 22px 40px}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:600}
.crumbs b{color:var(--accent2)}
#lesson-body h1{font-size:24px;margin:0 0 14px;letter-spacing:-.3px;line-height:1.25}
#lesson-body h2{font-size:16px;margin:22px 0 6px;color:var(--text)}
#lesson-body p{margin:0 0 12px}
#lesson-body ul,#lesson-body ol{margin:0 0 12px;padding-left:22px}
#lesson-body li{margin-bottom:5px}
#lesson-body pre{background:var(--code-bg);border:1px solid var(--border);border-radius:9px;padding:11px 13px;overflow-x:auto;font-family:var(--mono);font-size:12.8px;margin:0 0 12px;line-height:1.5}
#lesson-body pre code{background:none;border:none;padding:0;font-size:inherit}
.task-box{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:0 10px 10px 0;padding:12px 14px;margin:14px 0}
.task-box h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent2)}
.task-box ul{margin:0;padding-left:20px}
.task-box li{margin-bottom:4px;font-size:14px}
.lesson-nav{display:flex;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--border)}
.lesson-nav .spacer{flex:1}
details.hint{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:0;margin:10px 0;overflow:hidden}
details.hint summary{cursor:pointer;padding:10px 13px;font-weight:700;font-size:13.5px;color:var(--yellow);list-style:none;display:flex;align-items:center;gap:8px}
details.hint summary::-webkit-details-marker{display:none}
details.hint summary:before{content:"💡"}
details.hint[open] summary{border-bottom:1px solid var(--border)}
details.hint .hint-body{padding:11px 14px;font-size:14px;color:var(--muted)}
details.hint .hint-body pre{margin:8px 0 0}

/* editor */
.editor-wrap{position:relative;flex:1;min-height:0;background:var(--code-bg);overflow:hidden}
#highlight,#editor{
  margin:0;padding:14px 16px;border:0;font-family:var(--mono);font-size:13.6px;line-height:1.62;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;tab-size:4
}
#highlight{position:absolute;inset:0;overflow:auto;pointer-events:none;color:var(--text)}
#editor{
  position:absolute;inset:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--accent2);
  resize:none;outline:none;overflow:auto;z-index:2
}
#editor::selection{background:rgba(59,130,246,.35)}
.tok-com{color:#6b7794;font-style:italic}
.tok-str{color:#a5e07c}
.tok-kw{color:#ff7ab2;font-weight:600}
.tok-num{color:#f7c96b}
.tok-def{color:#7fd1ff}
.tok-call{color:#c8b6ff}
.tok-bi{color:#5fd7d0}
.tok-op{color:#e6e9f2}
[data-theme="light"] .tok-com{color:#8a93a8}
[data-theme="light"] .tok-str{color:#2f7d32}
[data-theme="light"] .tok-kw{color:#b3157a}
[data-theme="light"] .tok-num{color:#a35b00}
[data-theme="light"] .tok-def{color:#0b62a4}
[data-theme="light"] .tok-call{color:#6b3fd4}
[data-theme="light"] .tok-bi{color:#0e7490}
[data-theme="light"] .tok-op{color:#131a2b}
.editor-foot{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border-top:1px solid var(--border);flex:0 0 auto}
.editor-foot .hintkey{font-size:11.5px;color:var(--muted)}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 9px}
.status-dot.ok{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.7)}
.status-dot.load{background:var(--yellow);animation:pulse 1.1s infinite}
.status-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.status-txt{font-size:12px;color:var(--muted);font-weight:600}

/* console */
.console-body{flex:1;overflow-y:auto;padding:12px 14px;font-family:var(--mono);font-size:12.8px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.console-body.empty:before{content:"Вывод программы появится здесь…";color:var(--muted);font-family:inherit;font-style:italic}
.console-body .err{color:var(--red)}
.console-body .ok{color:var(--green)}
.console-body .dim{color:var(--muted)}
.console-body .sec{color:var(--accent2);font-weight:700;display:block;margin:6px 0 2px}
.test-list{list-style:none;margin:0;padding:0}
.test-list li{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13.5px;align-items:flex-start}
.test-list li .ic{width:19px;height:19px;flex:0 0 19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;margin-top:1px}
.test-list li.pass .ic{background:rgba(34,197,94,.16);color:var(--green)}
.test-list li.fail .ic{background:rgba(240,82,106,.16);color:var(--red)}
.test-list li.fail{background:rgba(240,82,106,.05)}
.test-list li .msg{flex:1}
.test-list li .msg small{display:block;color:var(--muted);font-family:var(--mono);font-size:11.8px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.result-banner{padding:12px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border)}
.result-banner.pass{background:rgba(34,197,94,.12);color:var(--green)}
.result-banner.fail{background:rgba(240,82,106,.1);color:var(--red)}
.result-banner.run{background:rgba(59,130,246,.12);color:var(--accent2)}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* banner / toast / modal */
#banner{display:none;padding:10px 16px;background:rgba(240,180,41,.14);border-bottom:1px solid var(--yellow);color:var(--text);font-size:13.5px;align-items:center;gap:10px}
#banner.show{display:flex}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:90;font-weight:600;font-size:14px
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(4,7,15,.72);display:none;place-items:center;z-index:80;padding:20px;overflow:auto}
.modal.show{display:grid}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:560px;width:100%;padding:26px;box-shadow:var(--shadow);position:relative}
.modal-card h2{margin:0 0 8px;font-size:22px}
.modal-card p{color:var(--muted);margin:0 0 16px;font-size:14px}
.modal-card input[type=text]{width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);outline:none;font-size:15px}
.modal-card input[type=text]:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.confetti{position:fixed;top:-14px;width:9px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(760deg);opacity:.15}}

/* certificate */
#cert-view{overflow-y:auto;padding:26px;background:var(--bg)}
.cert-paper{
  max-width:900px;margin:0 auto;background:#fffdf7;color:#1b2338;border:10px double #d9b45b;border-radius:6px;
  padding:44px 46px;box-shadow:var(--shadow);text-align:center;font-family:Georgia,"Times New Roman",serif
}
.cert-paper .seal{font-size:34px;letter-spacing:.3em;color:#c9962c;font-weight:700;text-transform:uppercase;font-size:15px}
.cert-paper h1{font-size:38px;margin:8px 0 2px;letter-spacing:-.5px}
.cert-paper .sub{color:#5d6478;font-size:15px;margin:0 0 26px}
.cert-paper .who{font-size:34px;border-bottom:2px solid #d9b45b;display:inline-block;padding:2px 26px;margin:6px 0 4px;font-style:italic}
.cert-paper .what{font-size:16px;color:#3c4459;max-width:640px;margin:14px auto 22px;line-height:1.6}
.cert-paper .trackname{font-size:22px;font-weight:700;color:#1b2338;margin-bottom:22px}
.cert-paper .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid #e2d7bb;padding-top:18px;font-size:13px;color:#5d6478}
.cert-paper .foot b{display:block;color:#1b2338;font-size:14px}
.cert-toolbar{max-width:900px;margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cert-toolbar .spacer{flex:1}
@media print{
  body{overflow:visible;height:auto;background:#fff}
  header.topbar,aside.sidebar,.cert-toolbar,.pane-head,#toast{display:none!important}
  .shell,main#main,#cert-view{display:block!important;height:auto!important;overflow:visible!important;padding:0!important}
  .view{display:none!important}
  #cert-view.active{display:block!important}
  .cert-paper{box-shadow:none;max-width:100%;border-width:6px}
}
/* responsive */
@media(max-width:1180px){
  .workspace{grid-template-columns:minmax(300px,1fr) minmax(340px,1fr)}
  .pane.out{grid-column:1 / -1;border-left:none;border-top:1px solid var(--border);max-height:38vh}
}
@media(max-width:900px){
  aside.sidebar{position:fixed;left:0;top:58px;bottom:0;z-index:50;transform:translateX(-105%);transition:transform .22s;box-shadow:var(--shadow)}
  aside.sidebar.open{transform:none}
  .topnav{display:none}
  .workspace{grid-template-columns:1fr;grid-auto-rows:minmax(240px,auto);overflow-y:auto}
  .pane + .pane{border-left:none;border-top:1px solid var(--border)}

  { id:'searchsort', title:'Поиск и сортировка: линейный, бинарный, пузырьковый',
    desc:`<p><b>Линейный поиск</b> перебирает элементы по порядку — работает с любым списком, сложность <code>O(n)</code>.</p>
<p><b>Бинарный поиск</b> работает только с <b>отсортированным</b> списком: каждый шаг делит диапазон пополам, сложность <code>O(log n)</code>.</p>
<pre><code>def binary_search(arr, x):
    lo, hi = 0, len(arr) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if arr[mid] == x:
            return mid
        if arr[mid] < x:
            lo = mid + 1
        else:
            hi = mid - 1
    return -1</code></pre>

<p>Декоратор <code>@property</code> превращает метод в «атрибут только для чтения», а <code>@&lt;имя&gt;.setter</code> позволяет контролировать запись.</p>
<pre><code>class Person:
    def __init__(self, name, age):
        self._name = name
        self.age = age          # вызовет setter

    @property
    def age(self):
        return self._age

    @age.setter
    def age(self, value):
        if not isinstance(value, int):
            raise TypeError('Возраст должен быть целым числом')

            raise ValueError('Возраст не может быть отрицательным')

  { id:'generators', title:'Генераторы, итераторы и модули',
    desc:`<p>Генератор создаёт значения «по запросу» и не хранит их все в памяти — идеально для больших данных и бесконечных последовательностей.</p>
<pre><code>def countdown(n):
    while n > 0:
        yield n          # вернуть значение и «заморозить» функцию
        n -= 1

list(countdown(3))       # [3, 2, 1]
sum(x * x for x in range(10**6))   # без создания списка</code></pre>
<h2>Протокол итерации</h2>
<p>Объект итерируем, если у него есть <code>__iter__</code>. Итератор также обязан иметь <code>__next__</code>, который в конце поднимает <code>StopIteration</code>.</p>
<pre><code>class Repeater:
    def __init__(self, value, times):
        self.value, self.times = value, times
    def __iter__(self):
        for _ in range(self.times):
            yield self.value</code></pre>
